[package]
name = "navette-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
futures-util = "0.3.34"
hostname = "0.4.2"
local-ip-address = "0.6.13"
mdns-sd = "0.21.7"
qrcode = "0.14.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
