name: Build Windows

# À chaque push sur main : tests + compilation de l'installateur (sans publier).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests du cœur réseau
        run: npm test

      - name: Compiler l'interface et l'installateur
        run: npm run dist

      - name: Publier l'installateur comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: Navette-Windows
          path: dist/Navette-Setup-*.exe
