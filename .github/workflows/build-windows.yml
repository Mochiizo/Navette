name: Build Windows

# Se lance à chaque push sur main, ou à la main depuis l'onglet "Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Installer Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Tests du cœur réseau
        run: cargo test -p navette-core

      - name: Compiler l'application et les installateurs
        run: cargo tauri build

      - name: Publier les fichiers
        uses: actions/upload-artifact@v4
        with:
          name: Navette-Windows
          path: |
            target/release/navette.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
