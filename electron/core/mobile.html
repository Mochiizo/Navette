<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Navette</title>
<style>
  :root {
    --ink: #fff; --muted: rgba(255,255,255,.72); --line: rgba(255,255,255,.1);
    --accent: #ff7a2f; --accent-hi: #ffb27a; --accent-ink: #1d0f06;
    --ok: #8af5aa; --err: #ff7b7b; --wave-speed: 7s;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: #0b0d12; }
  body { margin: 0; min-height: 100vh; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         color: var(--ink); display: flex; flex-direction: column; gap: 14px;
         padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  body.busy { --wave-speed: 3s; }

  /* Fond : ondes qui montent depuis le bas de l'écran */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
        background: radial-gradient(130% 80% at 50% 92%, #171c27 0%, #0b0d12 70%); }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.2px); background-size: 18px 18px; }
  .bg-src { position: absolute; left: 50%; top: 92%; width: 0; height: 0; }
  .wave { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 50%;
          border: 1.5px solid rgba(255,255,255,.5); opacity: 0;
          animation: wave var(--wave-speed) cubic-bezier(.2,.6,.3,1) infinite; }
  .wave.w2 { animation-delay: calc(var(--wave-speed) * .25); }
  .wave.w3 { animation-delay: calc(var(--wave-speed) * .5); }
  .wave.w4 { animation-delay: calc(var(--wave-speed) * .75); }
  @keyframes wave { 0% { transform: scale(.3); opacity: .85; border-color: rgba(255,138,61,.9); }
                    100% { transform: scale(14); opacity: 0; border-color: rgba(255,255,255,.2); } }
  .bg-core { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%;
             background: #ff8a3d; box-shadow: 0 0 26px 8px rgba(255,138,61,.55); }

  /* Verre */
  .glass { position: relative; border-radius: 24px; padding: 16px;
           background: linear-gradient(140deg, rgba(255,255,255,.17), rgba(255,255,255,.05) 60%);
           -webkit-backdrop-filter: blur(26px) saturate(175%); backdrop-filter: blur(26px) saturate(175%);
           border: 1px solid rgba(255,255,255,.2);
           box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 18px 44px rgba(0,0,0,.35); }
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                   background: radial-gradient(80% 60% at 15% 0%, rgba(255,255,255,.2), transparent 60%); }
  .glass > * { position: relative; }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 14px !important; border-radius: 22px !important; }
  .logo { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center;
          background: linear-gradient(180deg, #ff8a3d, #da4a0a); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .logo svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  header .who { flex: 1; min-width: 0; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header p { margin: 0; color: rgba(255,255,255,.75); font-size: 13px; }
  header strong { color: var(--ink); }
  .live { width: 10px; height: 10px; border-radius: 50%; background: #5cf08a; box-shadow: 0 0 10px #5cf08a; }

  h2 { font-size: 16px; margin: 0 0 12px; font-weight: 700; }
  .pick { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px;
          padding: 14px; border-radius: 16px; font-size: 16px; font-weight: 650; text-align: center;
          color: var(--accent-ink); border: 1px solid rgba(255,255,255,.55);
          background: linear-gradient(180deg, var(--accent-hi), var(--accent));
          box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 12px 30px rgba(255,122,47,.45); }
  .pick svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .pick:active { transform: scale(.98); }
  input[type=file] { display: none; }
  .summary { margin: 12px 0 0; font-size: 13px; color: rgba(255,255,255,.8); }
  .summary strong { color: var(--ink); }
  .bar { height: 8px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .2s;
           background: linear-gradient(90deg, var(--accent), #ffa868, var(--accent)); background-size: 200% 100%;
           animation: flow 3s linear infinite; box-shadow: 0 0 12px rgba(255,122,47,.5); }
  @keyframes flow { to { background-position: -200% 0; } }
  ul { list-style: none; margin: 10px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .state { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
  li.ok .state { color: var(--ok); } li.err .state { color: var(--err); }
  .note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
  .ghost { font: inherit; font-size: 13px; color: var(--ink); min-height: 36px; padding: 0 12px; border-radius: 10px;
           background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .ghost:disabled { opacity: .55; }
  #retry { margin-top: 10px; }
  a.dl { color: var(--accent-hi); font-weight: 600; text-decoration: none; white-space: nowrap; padding: 8px 0; font-size: 14px; }
  li.got a.dl { color: var(--ok); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .head h2 { margin: 0; }
  #whereNote { margin: 0 0 4px; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { .wave, .bar i { animation: none; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-dots"></div>
  <div class="bg-src"><span class="wave"></span><span class="wave w2"></span><span class="wave w3"></span><span class="wave w4"></span><span class="bg-core"></span></div>
</div>

<header class="glass">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 9h12m-3-3 3 3-3 3M19 15H7m3 3-3-3 3-3"/></svg></div>
  <div class="who"><h1>Navette</h1><p>Connecté à <strong>{{PC_NAME}}</strong></p></div>
  <span class="live" role="img" aria-label="Connecté"></span>
</header>

<section class="glass">
  <h2>Envoyer vers l'ordinateur</h2>
  <label class="pick" for="files">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
    Choisir photos, vidéos ou fichiers
  </label>
  <input id="files" type="file" multiple>
  <div id="sendBox" hidden>
    <p class="summary" id="summary"></p>
    <div class="bar"><i id="totalBar"></i></div>
    <p class="note" id="wakeNote">Gardez cette page ouverte et l'écran allumé jusqu'à la fin.</p>
    <button class="ghost" id="retry" hidden>Réessayer les fichiers en échec</button>
    <ul id="sendList"></ul>
  </div>
</section>

<section class="glass">
  <div class="head">
    <h2>Reçus de l'ordinateur</h2>
    <button class="ghost" id="dlAll" hidden>Tout télécharger</button>
  </div>
  <p class="note" id="whereNote"></p>
  <ul id="recvList"><p class="empty">Rien pour l'instant. Les fichiers partagés depuis le PC apparaîtront ici.</p></ul>
</section>

<script>
const token = new URLSearchParams(location.search).get('t');
const q = (s) => document.querySelector(s);
const fmt = (n) => n < 1024 ? n + ' o' : n < 1048576 ? (n/1024).toFixed(0) + ' Ko'
  : n < 1073741824 ? (n/1048576).toFixed(1) + ' Mo' : (n/1073741824).toFixed(2) + ' Go';
const esc = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- Envoi vers le PC ----------
let queue = [];       // { file, li, status: 'wait'|'run'|'ok'|'err', sent }
let running = false;
let wakeLock = null;

async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (_) { /* pas supporté : on garde juste le message */ }
}
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') keepAwake(true); });

q('#files').addEventListener('change', (e) => {
  const picked = [...e.target.files];
  e.target.value = '';
  if (!picked.length) return;
  q('#sendBox').hidden = false;
  for (const file of picked) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="name">${esc(file.name)}</span><span class="state">en attente</span>`;
    q('#sendList').appendChild(li);
    queue.push({ file, li, status: 'wait', sent: 0 });
  }
  run();
});

q('#retry').addEventListener('click', () => {
  queue.filter(i => i.status === 'err').forEach(i => { i.status = 'wait'; i.sent = 0; setState(i, 'en attente'); });
  run();
});

function setState(item, text, cls) {
  item.li.className = cls || '';
  item.li.querySelector('.state').textContent = text;
}

function refreshSummary() {
  const total = queue.reduce((a, i) => a + i.file.size, 0);
  const sent = queue.reduce((a, i) => a + (i.status === 'ok' ? i.file.size : i.sent), 0);
  const ok = queue.filter(i => i.status === 'ok').length;
  const err = queue.filter(i => i.status === 'err').length;
  q('#summary').innerHTML = `<strong>${ok} / ${queue.length}</strong> fichiers envoyés · ${fmt(sent)} sur ${fmt(total)}`
    + (err ? ` · <span style="color:var(--err)">${err} en échec</span>` : '');
  q('#totalBar').style.width = total ? (100 * sent / total).toFixed(1) + '%' : '0';
  q('#retry').hidden = !(err && !running);
}

function uploadOne(item, batch, index, count) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    const params = new URLSearchParams({ t: token, name: item.file.name, size: item.file.size, batch, index, count });
    xhr.open('POST', '/api/v1/phone/upload?' + params);
    xhr.upload.onprogress = (e) => {
      item.sent = e.loaded;
      setState(item, item.file.size ? Math.floor(100 * e.loaded / item.file.size) + ' %' : '…');
      refreshSummary();
    };
    xhr.onload = () => resolve(xhr.status >= 200 && xhr.status < 300 ? null : (xhr.responseText || 'erreur ' + xhr.status));
    xhr.onerror = () => resolve('connexion perdue');
    xhr.send(item.file);
  });
}

async function run() {
  if (running) return;
  running = true;
  document.body.classList.add('busy');
  keepAwake(true);
  const batch = Math.random().toString(36).slice(2, 12);
  const todo = queue.filter(i => i.status === 'wait');
  for (let n = 0; n < todo.length; n++) {
    const item = todo[n];
    item.status = 'run';
    let error = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
      item.sent = 0;
      error = await uploadOne(item, batch, n, todo.length);
      if (!error) break;
      setState(item, `nouvel essai (${attempt}/3)…`);
      await new Promise(r => setTimeout(r, 1500 * attempt));
    }
    item.status = error ? 'err' : 'ok';
    setState(item, error ? 'échec' : '✓ envoyé', error ? 'err' : 'ok');
    if (error) item.li.title = error;
    refreshSummary();
  }
  running = false;
  document.body.classList.remove('busy');
  keepAwake(false);
  refreshSummary();
  if (queue.every(i => i.status === 'ok')) q('#wakeNote').textContent = 'Tout est arrivé sur l\'ordinateur.';
}

// ---------- Fichiers partagés par le PC ----------
// Le navigateur range les fichiers téléchargés dans le dossier Téléchargements
// du téléphone. Une page web ne peut pas choisir un autre dossier.
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
q('#whereNote').textContent = isIOS
  ? 'Ils arrivent dans l\'app Fichiers › Téléchargements. Pour mettre une photo dans Photos : ouvrez-la dans Fichiers › Partager › Enregistrer l\'image.'
  : 'Ils arrivent dans le dossier Téléchargements (Download) du téléphone.';

let shared = [];
let lastShared = '';
const got = new Set(); // fichiers déjà téléchargés pendant cette visite
const dlUrl = (f) => `/api/v1/phone/download/${f.id}?t=${encodeURIComponent(token)}`;

function download(f) {
  const a = document.createElement('a');
  a.href = dlUrl(f);
  a.download = f.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  markGot(f.id);
}

function markGot(id) {
  got.add(id);
  const li = q(`#recvList li[data-id="${id}"]`);
  if (li) { li.classList.add('got'); li.querySelector('.dl').textContent = '✓ Téléchargé'; }
  updateAllButton();
}

function updateAllButton() {
  const left = shared.filter(f => !got.has(f.id)).length;
  const btn = q('#dlAll');
  btn.hidden = shared.length < 2;
  btn.disabled = left === 0;
  btn.textContent = left ? `Tout télécharger (${left})` : 'Tout est téléchargé';
}

q('#recvList').addEventListener('click', (e) => {
  const a = e.target.closest('a.dl');
  if (!a) return;
  e.preventDefault();
  const f = shared.find(x => x.id === a.dataset.id);
  if (f) download(f);
});

q('#dlAll').addEventListener('click', async () => {
  // Un petit délai entre chaque fichier : sinon le navigateur n'en garde qu'un.
  for (const f of shared.filter(x => !got.has(x.id))) {
    download(f);
    await new Promise(r => setTimeout(r, 1200));
  }
});

async function loadShared() {
  try {
    const r = await fetch('/api/v1/phone/shared?t=' + encodeURIComponent(token), { cache: 'no-store' });
    if (!r.ok) return;
    const list = await r.json();
    const key = JSON.stringify(list.map(f => f.id));
    if (key === lastShared) return;
    lastShared = key;
    shared = list;
    const ul = q('#recvList');
    if (!list.length) {
      ul.innerHTML = '<p class="empty">Rien pour l\'instant. Les fichiers partagés depuis le PC apparaîtront ici.</p>';
    } else {
      ul.innerHTML = list.map(f => {
        const done = got.has(f.id);
        return `<li data-id="${f.id}" class="${done ? 'got' : ''}"><span class="name">${esc(f.name)}</span>
          <span class="state">${fmt(f.size)}</span>
          <a class="dl" data-id="${f.id}" href="${dlUrl(f)}">${done ? '✓ Téléchargé' : 'Télécharger'}</a></li>`;
      }).join('');
    }
    updateAllButton();
  } catch (_) { /* PC injoignable : on réessaie plus tard */ }
}
loadShared();
setInterval(loadShared, 4000);
</script>
</body>
</html>
